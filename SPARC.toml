[Keithley.Bias]
_conditions.require_launching_after = ["Caribou.SPARC"]

port = "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Cable_FT4YESGG-if00-port0"
device = "2410"
terminal = "front"

voltage = -1.2
voltage_step = 0.2
settle_time = 0.1
compliance = 650e-6
ovp = 20.0

[MessagePackWriter.SPARC]
_data.receive_from = ["Caribou.SPARC"]
_data.file_conflict_strategy = "ERROR"

output_directory = "/home/teleuser/Nellie/data/test/"
buffer_size = 1

[Caribou.SPARC]

#peary_verbosity = "DEBUG"

[Caribou.SPARC.devices.SPARC]
type = "SPARC"

# Chip voltages and currents
vcasb = 0.300
vreset = 0.116 # => 10pA pixel
#vreset = 1.42 # => 70pA pixel
vh = 0.600

[Caribou.SPARC.devices.SPARC.memories]
ro_busy_until_fifo_empty = 1

pulse_duration = 250      #1 micro second

[Caribou.SPARC.devices.SPARC.registers]
# Acqusition + ToT mode
conf_acq_mode = 0 # 0 is matrix, 1 is fastOR only (broken?), 2 matrix+fastOR
conf_tot_disable = 0 # 0 is with ToT, 1 is without ToT

# Injection
conf_pulse_mode = 1 # 0 is digital, 1 is analog

# Masking (only pixel col 6, row 6 enabled)
enable_col_0 = 0
enable_col_1 = 0
enable_col_2 = 0
enable_col_3 = 0
enable_col_4 = 0
enable_col_5 = 0
enable_col_6 = 1
